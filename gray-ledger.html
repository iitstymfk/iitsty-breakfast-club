<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07050c">
<title>Dungeon Dwellers: The Gray Ledger</title>
<style>
:root{color-scheme:dark;--ink:#f4ead8;--dim:#b9ab95;--gold:#e9b85a;--red:#e2574c;--blue:#7cc6ff;--bg:#07050c;--panel:rgba(10,7,16,.86)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#game{position:fixed;inset:0;overflow:hidden;background:#000}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
#stage{position:absolute;left:0;right:0;bottom:21vh;height:62%;pointer-events:none;display:flex;justify-content:center;align-items:flex-end;gap:0}
.actor{position:absolute;bottom:0;width:min(46vw,300px);transition:left .6s ease,opacity .5s ease,transform .5s ease,filter .4s;filter:brightness(.62) saturate(.8);transform-origin:50% 100%}
.actor.on{filter:none}
.actor.talk .mo-c{display:none}.actor.talk .mo-o{display:block}
.actor .mo-o{display:none}
.actor.talk.flap .mo-o{display:none}.actor.talk.flap .mo-c{display:block}
.actor svg{width:100%;height:auto;display:block;animation:breathe 4.2s ease-in-out infinite}
.actor .eyelid{animation:blink 5.3s infinite}
.actor.hurt svg{animation:breathe 4.2s ease-in-out infinite,hurtj .45s}
@keyframes breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.2%) scaleY(1.008)}}
@keyframes blink{0%,95%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
@keyframes hurtj{0%{transform:translateX(0)}25%{transform:translateX(-4%)}50%{transform:translateX(4%)}100%{transform:none}}
#bars i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .8s ease;z-index:5}
#bars i:first-child{top:0}#bars i:last-child{bottom:0}
#game.cine #bars i{height:9vh}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.65) 100%);z-index:2}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;transition:opacity .25s}
#hud{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;z-index:30;display:flex;gap:8px}
.hbtn{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.18);color:var(--ink);border-radius:20px;padding:7px 12px;font:600 13px system-ui,sans-serif}
#remember{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:31;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:70%}
.rem{background:rgba(0,0,0,.55);padding:7px 12px 7px 34px;border-radius:4px;font:italic 15px Georgia,serif;color:#fff;position:relative;animation:remIn 4.2s forwards;text-shadow:0 1px 3px #000}
.rem:before{content:"";position:absolute;left:10px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 8px var(--gold)}
@keyframes remIn{0%{opacity:0;transform:translateX(-12px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#dlg{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:0 14px calc(env(safe-area-inset-bottom) + 16px);display:none;background:linear-gradient(transparent,rgba(0,0,0,.82) 32%)}
#dlg.show{display:block}
#who{font:700 15px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 4px;text-shadow:0 2px 4px #000}
#line{font-size:19px;line-height:1.42;min-height:3.2em;text-shadow:0 2px 4px #000,0 0 2px #000}
#line.narr{font-style:italic;color:#e7dcc8}
#tapnext{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom) + 10px);font:12px system-ui;color:var(--dim);opacity:0;transition:opacity .3s}
#dlg.done #tapnext{opacity:.8}
#choices{position:absolute;left:0;right:0;bottom:0;z-index:22;padding:12px 12px calc(env(safe-area-inset-bottom) + 14px);display:none;background:linear-gradient(transparent,rgba(0,0,0,.88) 22%)}
#choices.show{display:block}
#cq{font:italic 16px Georgia,serif;color:var(--dim);margin:20px 4px 10px;text-shadow:0 1px 3px #000}
#copts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#copts.one{grid-template-columns:1fr}
.copt{background:rgba(18,12,26,.92);border:1px solid rgba(233,184,90,.35);color:var(--ink);font:17px Georgia,serif;padding:14px 12px;border-radius:6px;text-align:left;min-height:56px;line-height:1.25;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.copt:active{background:#3a2a12}
.copt .k{display:inline-block;min-width:22px;color:var(--gold);font:700 13px system-ui}
.copt.big{grid-column:1/-1;text-align:center;border-color:var(--gold)}
#ctimer{height:5px;background:rgba(255,255,255,.14);border-radius:3px;margin:12px 2px 0;overflow:hidden;display:none}
#ctimer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#fff,var(--gold));transform-origin:left}
#qte{position:absolute;inset:0;z-index:40;display:none}
#qte.show{display:block}
#qte .ring{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font:800 28px system-ui;color:#fff;text-shadow:0 0 10px #000;box-shadow:0 0 22px rgba(255,255,255,.55),inset 0 0 18px rgba(255,255,255,.35);background:rgba(0,0,0,.25)}
#qte .shrink{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--gold);pointer-events:none}
#qte .lbl{position:absolute;left:0;right:0;top:22%;text-align:center;font:800 22px system-ui;letter-spacing:.12em;color:#fff;text-shadow:0 0 12px #000,0 2px 4px #000}
#qte .meter{position:absolute;left:12%;right:12%;top:30%;height:16px;border:2px solid #fff;border-radius:9px;overflow:hidden;background:rgba(0,0,0,.5)}
#qte .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#fff)}
#qte .meter b{position:absolute;top:0;bottom:0;background:rgba(124,198,255,.45);border-left:2px solid var(--blue);border-right:2px solid var(--blue)}
#qte .arrow{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;font:900 76px system-ui;color:#fff;box-shadow:0 0 30px rgba(255,255,255,.4);background:rgba(0,0,0,.3)}
#qte .ok{border-color:#8f8!important;box-shadow:0 0 30px #8f8!important}
#qte .bad{border-color:var(--red)!important;box-shadow:0 0 30px var(--red)!important}
#insp{position:absolute;inset:0;z-index:15;display:none}
#insp.show{display:block}
.hot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.hot:before{content:"";width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 22px rgba(255,255,255,.6);animation:hotp 1.8s ease-in-out infinite}
.hot.seen:before{background:transparent;border:2px solid rgba(255,255,255,.75);box-shadow:none;animation:none;width:11px;height:11px}
.hot span{position:absolute;top:40px;white-space:nowrap;font:600 12px system-ui;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:9px;opacity:.9}
@keyframes hotp{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.15);opacity:1}}
#ibar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.85) 30%);display:flex;align-items:flex-end;gap:10px}
#ibar p{flex:1;margin:0;font:italic 15px Georgia,serif;color:var(--dim)}
#ileave{background:rgba(18,12,26,.95);border:1px solid var(--gold);color:var(--ink);font:16px Georgia;padding:11px 16px;border-radius:6px}
#ileave[disabled]{opacity:.35}
#look{position:absolute;inset:0;z-index:16;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55)}
#look.show{display:flex}
#look .card{width:min(88vw,420px);background:#120c18;border:1px solid rgba(233,184,90,.45);border-radius:8px;padding:16px 16px 12px;box-shadow:0 10px 40px #000}
#look .ic{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:radial-gradient(#2a1d33,#0b0710);border-radius:6px;margin-bottom:10px}
#look .ic svg{height:130px}
#look h3{margin:0 0 6px;font:700 17px Georgia;color:var(--gold)}
#look p{margin:0 0 12px;font-size:16px;line-height:1.4}
#look .row{display:flex;gap:8px;flex-wrap:wrap}
#look button{flex:1;background:#24182e;border:1px solid rgba(255,255,255,.2);color:var(--ink);font:15px Georgia;padding:10px;border-radius:6px}
#card{position:absolute;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000;padding:20px}
#card.show{display:flex;animation:fadein 1s}
#card .ep{font:600 13px system-ui;letter-spacing:.35em;color:var(--dim);text-transform:uppercase}
#card h1{font:400 clamp(30px,8vw,56px) Georgia;margin:12px 0 6px;color:var(--ink);letter-spacing:.04em}
#card .sub{font:italic 17px Georgia;color:var(--gold)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#menu,#panel{position:absolute;inset:0;z-index:60;display:none;overflow:auto;background:radial-gradient(ellipse at 50% 30%,rgba(40,20,50,.55),rgba(0,0,0,.92));padding:calc(env(safe-area-inset-top) + 24px) 18px 30px}
#menu.show,#panel.show{display:block}
#menu .logo{text-align:center;margin:6vh 0 4vh}
#menu .logo small{display:block;font:600 12px system-ui;letter-spacing:.45em;color:var(--dim)}
#menu .logo b{display:block;font:400 clamp(34px,10vw,64px) Georgia;letter-spacing:.06em;line-height:1.05;text-shadow:0 0 30px rgba(233,184,90,.35)}
#menu .logo i{display:block;font:italic 18px Georgia;color:var(--gold);margin-top:8px}
.mbtn{display:block;width:min(100%,380px);margin:10px auto;background:rgba(18,12,26,.9);border:1px solid rgba(233,184,90,.4);color:var(--ink);font:18px Georgia;padding:14px;border-radius:6px}
.mbtn small{display:block;font:12px system-ui;color:var(--dim);margin-top:3px}
#panel h2{font:400 26px Georgia;margin:0 0 14px;color:var(--gold)}
#panel .box{background:rgba(18,12,26,.9);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:12px 14px;margin-bottom:12px}
#panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;font:15px system-ui;padding:8px 0}
#panel select,#panel input[type=range]{max-width:55%}
#panel .note{font:13px system-ui;color:var(--dim);line-height:1.45}
.rcap{font:15px Georgia;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.rcap b{color:var(--gold);font-weight:400}
.ending{display:inline-block;margin:4px;padding:6px 10px;border-radius:14px;font:13px system-ui;border:1px solid rgba(255,255,255,.2)}
.ending.got{border-color:var(--gold);color:var(--gold)}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:70;background:rgba(0,0,0,.8);padding:10px 16px;border-radius:8px;font:14px system-ui;display:none;max-width:80%;text-align:center}
#rel{position:absolute;top:calc(env(safe-area-inset-top) + 50px);right:10px;z-index:29;display:none;flex-direction:column;gap:4px}
#rel.show{display:flex}
#rel div{font:12px system-ui;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:10px;text-align:right}
</style>
</head>
<body>
<div id="game">
  <canvas id="scene"></canvas>
  <div id="vign"></div>
  <div id="stage"></div>
  <div id="bars"><i></i><i></i></div>
  <div id="fx"></div>
  <div id="insp"><div id="hots"></div><div id="ibar"><p id="ihint">Tap the white circles to look around.</p><button id="ileave">Move on</button></div></div>
  <div id="look"><div class="card"><div class="ic"></div><h3></h3><p></p><div class="row"></div></div></div>
  <div id="dlg"><div id="who"></div><div id="line"></div><div id="tapnext">tap ▸</div></div>
  <div id="choices"><div id="cq"></div><div id="copts"></div><div id="ctimer"><i></i></div></div>
  <div id="qte"></div>
  <div id="remember"></div>
  <div id="rel"></div>
  <div id="hud"><button class="hbtn" id="hrel">♥</button><button class="hbtn" id="hmenu">☰</button></div>
  <div id="card"><div class="ep"></div><h1></h1><div class="sub"></div></div>
  <div id="menu"></div>
  <div id="panel"></div>
  <div id="toast"></div>
</div>
<script>
/* ==========================================================================
   DUNGEON DWELLERS: THE GRAY LEDGER  -  a Telltale-style narrative chapter game
   Core: helpers, seeded randomness, sound, voices (Piper neural voices + phone voice fallback)
   ========================================================================== */
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var J = function (s, d) { try { var v = JSON.parse(s); return v == null ? d : v; } catch (e) { return d; } };
var LS = {
    get: function (k, d) { try { return J(localStorage.getItem(k), d); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};
var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };

/* ---------------------------------------------------------------- seeded randomness: every run is its own seed */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var RNG = { seed: 1, n: 0, f: mulberry(1) };
function reseed(seed, n) { RNG.seed = seed >>> 0; RNG.n = 0; RNG.f = mulberry(RNG.seed); for (var i = 0; i < (n || 0); i++) rnd(); }
function rnd() { RNG.n++; return RNG.f(); }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function chance(p) { return rnd() < p; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function weighted(o) { var tot = 0, k; for (k in o) tot += o[k]; var r = rnd() * tot; for (k in o) { r -= o[k]; if (r <= 0) return k; } return k; }

/* ---------------------------------------------------------------- settings */
var CFG = Object.assign({ music: 0.55, sfx: 0.8, voice: 1, piper: false, speed: 32, auto: false, qte: 'normal', rel: true, timers: true }, LS.get('ddt_cfg', {}));
function saveCfg() { LS.set('ddt_cfg', CFG); }

/* ---------------------------------------------------------------- sound: ambience, stings, hits (all made live, no files) */
var AU = (function () {
    var ctx = null, master, mus, sfx, amb = null;
    function init() {
        if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        master = ctx.createGain(); master.connect(ctx.destination);
        mus = ctx.createGain(); mus.gain.value = CFG.music * 0.5; mus.connect(master);
        sfx = ctx.createGain(); sfx.gain.value = CFG.sfx; sfx.connect(master);
        return ctx;
    }
    function vol() { if (!ctx) return; mus.gain.setTargetAtTime(CFG.music * 0.5 * (duck ? 0.45 : 1), ctx.currentTime, 0.3); sfx.gain.value = CFG.sfx; }
    var duck = false;
    function setDuck(d) { duck = d; vol(); }
    function noiseBuf() { var b = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), d = b.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
    var NB = null;
    /* a drone per place: root note, colour, wind */
    var MOODS = {
        gate: [55, 'sine', 0.5, 900], office: [65.4, 'triangle', 0.15, 500], lift: [49, 'sawtooth', 0.35, 400], crypt: [46.2, 'sine', 0.25, 600],
        cage: [46.2, 'triangle', 0.3, 500], camp: [73.4, 'triangle', 0.08, 700], ice: [61.7, 'sine', 0.45, 1600], chapel: [82.4, 'sine', 0.2, 2000],
        forge: [41.2, 'sawtooth', 0.15, 300], throne: [36.7, 'sawtooth', 0.3, 350], surface: [87.3, 'sine', 0.25, 2500], black: [41.2, 'sine', 0.1, 300]
    };
    function ambience(name) {
        if (!init()) return;
        var m = MOODS[name] || MOODS.black;
        if (amb && amb.name === name) return;
        var old = amb; amb = { name: name, nodes: [] };
        if (old) { old.g.gain.setTargetAtTime(0, ctx.currentTime, 0.8); setTimeout(function () { old.nodes.forEach(function (n) { try { n.stop(); } catch (e) { } }); }, 4000); }
        var g = ctx.createGain(); g.gain.value = 0; g.connect(mus); amb.g = g;
        var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = m[3]; lp.connect(g);
        [1, 1.5, 2.004, 0.5].forEach(function (mul, i) {
            var o = ctx.createOscillator(); o.type = i === 3 ? 'sine' : m[1]; o.frequency.value = m[0] * mul; o.detune.value = (i - 1.5) * 6;
            var og = ctx.createGain(); og.gain.value = [0.16, 0.09, 0.05, 0.2][i];
            var lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.03; var lg = ctx.createGain(); lg.gain.value = 0.05; lfo.connect(lg); lg.connect(og.gain);
            o.connect(og); og.connect(lp); o.start(); lfo.start(); amb.nodes.push(o, lfo);
        });
        if (!NB) NB = noiseBuf();
        var n = ctx.createBufferSource(); n.buffer = NB; n.loop = true;
        var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = 0.6;
        var ng = ctx.createGain(); ng.gain.value = m[2] * 0.25;
        var wl = ctx.createOscillator(); wl.frequency.value = 0.09; var wg = ctx.createGain(); wg.gain.value = 300; wl.connect(wg); wg.connect(bp.frequency);
        n.connect(bp); bp.connect(ng); ng.connect(g); n.start(); wl.start(); amb.nodes.push(n, wl);
        g.gain.setTargetAtTime(1, ctx.currentTime, 1.5);
    }
    function tone(f, d, type, v, when, slide) {
        if (!init()) return; var t = ctx.currentTime + (when || 0);
        var o = ctx.createOscillator(), g = ctx.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.3, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g); g.connect(sfx); o.start(t); o.stop(t + d + 0.05);
    }
    function hit(v, f) {
        if (!init()) return; var t = ctx.currentTime;
        if (!NB) NB = noiseBuf();
        var n = ctx.createBufferSource(); n.buffer = NB; var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = f || 900;
        var g = ctx.createGain(); g.gain.setValueAtTime(v || 0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        n.connect(lp); lp.connect(g); g.connect(sfx); n.start(t); n.stop(t + 0.4);
        tone(90, 0.3, 'sine', (v || 0.6) * 0.8, 0, 40);
    }
    var S = {
        remember: function () { tone(880, 0.6, 'sine', 0.12); tone(1320, 0.9, 'sine', 0.08, 0.08); },
        choice: function () { tone(220, 0.12, 'triangle', 0.15); },
        pick: function () { tone(440, 0.15, 'triangle', 0.18); tone(660, 0.2, 'sine', 0.1, 0.05); },
        tick: function () { tone(1200, 0.05, 'square', 0.04); },
        qte: function () { tone(150, 0.25, 'sawtooth', 0.25, 0, 300); },
        good: function () { tone(523, 0.12, 'triangle', 0.2); tone(784, 0.25, 'triangle', 0.18, 0.06); },
        bad: function () { hit(0.8, 400); tone(110, 0.6, 'sawtooth', 0.2, 0, 55); },
        tap: function () { tone(700 + Math.random() * 200, 0.06, 'square', 0.06); },
        look: function () { tone(988, 0.25, 'sine', 0.1); },
        boom: function () { hit(1, 300); },
        sting: function () { tone(110, 2.2, 'sawtooth', 0.18, 0, 55); tone(116.5, 2.2, 'sawtooth', 0.12); },
        bell: function () { [0, 0.35, 0.7].forEach(function (w, i) { tone([392, 330, 262][i], 2, 'sine', 0.15, w); }); },
        death: function () { tone(73, 3, 'sawtooth', 0.25, 0, 30); hit(1, 200); }
    };
    return { init: init, ambience: ambience, s: S, vol: vol, duck: setDuck, hit: hit, tone: tone, get ctx() { return ctx; } };
})();

/* ---------------------------------------------------------------- voices
   Piper: the same neural voices as Dungeon Dwellers (same voice model, same cast, same saved download).

    var m = $('#menu');
    m.innerHTML = '<div class="logo"><small>DUNGEON DWELLERS</small><b>The Gray<br>Ledger</b><i>a story in five chapters</i></div>' +
        (save ? '<button class="mbtn" id="m_cont">Continue<small>' + CHAPTERS[save.ch].n + ': ' + CHAPTERS[save.ch].t + '</small></button>' : '') +
        '<button class="mbtn" id="m_new">' + (save ? 'New run' : 'Begin') + '<small>Every run rolls new debts, events, a new traitor and a new fate for Wren</small></button>' +
        '<button class="mbtn" id="m_end">Endings<small>' + Object.keys(got).length + ' of ' + Object.keys(ENDINGS).length + ' found</small></button>' +
        '<button class="mbtn" id="m_set">Settings<small>Voices, text, quick-time events</small></button>' +
        '<div class="note" style="text-align:center;margin-top:18px;font:12px system-ui;color:#8a7d6a">Choices matter. Characters will remember. Some of them will not come back.</div>';
    m.classList.add('show');
    var go = function (f) { return function () { AU.init(); f(); }; };
    if (save) $('#m_cont').onclick = go(function () { m.classList.remove('show'); continueRun(); });
    $('#m_new').onclick = go(function () { m.classList.remove('show'); newRun(); });
    $('#m_end').onclick = go(endingsPanel);
    $('#m_set').onclick = go(function () { settings(false); });
}
function endingsPanel() {
    var got = LS.get('ddt_endings', {}), p = $('#panel');
    p.innerHTML = '<h2>Endings</h2>' + Object.keys(ENDINGS).map(function (k) { return '<div class="box"><b style="color:' + (got[k] ? 'var(--gold)' : '#666') + '">' + (got[k] ? ENDINGS[k].t : '???') + '</b><div class="note">' + (got[k] ? ENDINGS[k].d : 'Not found yet.') + '</div></div>'; }).join('') + '<button class="mbtn" id="pback">Back</button>';
    p.classList.add('show'); $('#pback').onclick = function () { p.classList.remove('show'); };
}
function settings(inGame) {
    var p = $('#panel');
    function vs() { var M = VO.M; return M.state === 'download' ? 'Downloading voice: ' + (M.total ? Math.round(M.got / M.total * 100) + '%' : Math.round(M.got / 1e6) + ' MB') : M.state === 'ready' ? 'Piper voices ready.' : M.state === 'error' ? 'Piper could not start (' + M.err + '). The phone\'s own voice is used.' : M.state === 'loading' || M.state === 'starting' ? 'Starting Piper...' : 'Off. Uses the phone\'s own voice.'; }
    p.innerHTML = '<h2>' + (inGame ? 'Paused' : 'Settings') + '</h2>' +
        (inGame ? '<button class="mbtn" id="s_res">Resume</button>' : '') +
        '<div class="box"><label>Voices <input type="checkbox" id="s_voice"' + (CFG.voice ? ' checked' : '') + '></label>' +
        '<label>Piper neural voices <input type="checkbox" id="s_piper"' + (CFG.piper ? ' checked' : '') + '></label>' +
        '<div class="note" id="s_vs">' + vs() + '</div><div class="note">Same voices as Dungeon Dwellers (Lyra, Bror, the narrator...). First time it downloads about 120 MB and keeps it on the phone. If you already turned Piper on in Dungeon Dwellers on this site, it is already saved.</div></div>' +
        '<div class="box"><label>Text speed <input type="range" id="s_speed" min="15" max="90" value="' + CFG.speed + '"></label>' +
        '<label>Auto-play lines <input type="checkbox" id="s_auto"' + (CFG.auto ? ' checked' : '') + '></label>' +
        '<label>Timed choices <input type="checkbox" id="s_timers"' + (CFG.timers ? ' checked' : '') + '></label>' +
        '<label>Quick-time events <select id="s_qte"><option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option></select></label></div>' +
        '<div class="box"><label>Music <input type="range" id="s_mus" min="0" max="1" step=".05" value="' + CFG.music + '"></label><label>Sound <input type="range" id="s_sfx" min="0" max="1" step=".05" value="' + CFG.sfx + '"></label></div>' +
        (inGame ? '<button class="mbtn" id="s_quit">Quit to menu<small>Progress is saved at the start of every scene</small></button>' : '<button class="mbtn" id="s_back">Back</button>');
    p.classList.add('show');
    $('#s_qte').value = CFG.qte;
    VO.onState = function () { var el = $('#s_vs'); if (el) el.textContent = vs(); };
    var ch = function () { CFG.voice = $('#s_voice').checked; CFG.speed = +$('#s_speed').value; CFG.auto = $('#s_auto').checked; CFG.timers = $('#s_timers').checked; CFG.qte = $('#s_qte').value; CFG.music = +$('#s_mus').value; CFG.sfx = +$('#s_sfx').value; saveCfg(); AU.vol(); };
    p.querySelectorAll('input,select').forEach(function (el) { el.onchange = ch; el.oninput = ch; });
    $('#s_piper').onchange = function () { if (this.checked) { VO.enable(); } else { CFG.piper = false; saveCfg(); } $('#s_vs').textContent = vs(); };
    if (inGame) { $('#s_res').onclick = function () { p.classList.remove('show'); }; $('#s_quit').onclick = function () { p.classList.remove('show'); menu(); }; }
    else $('#s_back').onclick = function () { p.classList.remove('show'); };
}
$('#hmenu').onclick = function () { settings(true); };
$('#hrel').onclick = function () {
    var r = $('#rel'); if (r.classList.contains('show')) { r.classList.remove('show'); return; }
    r.innerHTML = ['lyra', 'bror', 'mira', 'cobb', 'ash', 'wren'].filter(function (k) { return F('met_' + k); }).map(function (k) { return '<div style="color:' + colOf(k) + '">' + nameOf(k) + ': ' + (alive(k) ? relWord(k) : 'gone') + '</div>'; }).join('') || '<div>No one yet.</div>';
    r.classList.add('show'); setTimeout(function () { r.classList.remove('show'); }, 4000);
};
document.addEventListener('visibilitychange', function () { if (document.hidden) VO.stop(); });
if (CFG.piper) VO.boot().catch(function () { });
menu();
window.__ddt = { get S() { return S; }, CHAPTERS: CHAPTERS, play: play, newRun: newRun, menu: menu };
</script>
</body>
</html>
